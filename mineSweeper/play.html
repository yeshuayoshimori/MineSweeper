        <h1><img src="assets/logomine.webp">Play</h1>

    <main>
        <p>
            This is where you can play the game.

        <div class="game">

                <span class="counter">015</span> <!--mines-->

            <div class="board"> <!--72 tiles like in sample sprite, so 9x7-->

                <div class="cell open"></div><div class="cell open"></div><div class="cell open n1">1</div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>

                <!--3-->
                <div class="cell open n3">3</div><div class="cell open n1">1</div><div class="cell open n2">2</div><div class="cell"><img src="assets/flagmine.png" alt="Flag"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
                <!--Rows 4 to 9 are all still closed, not opened-->
                <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
                <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
                <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
                <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        </div>


</body>
